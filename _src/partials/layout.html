<!doctype html>
<html lang="en-US" class="{{page.htmlclass}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#0F2B24">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Keystone Power Holdings">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{page.site_url}}/{{page.og_image}}">
  <meta property="og:image:secure_url" content="{{page.site_url}}/{{page.og_image}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Keystone Power Holdings: Solar that pays from day one. Solar for cities, schools, non-profits and businesses with nothing upfront.">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{page.title}}">
  <meta name="twitter:description" content="{{page.description}}">
  <meta name="twitter:image" content="{{page.site_url}}/{{page.og_image}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <script>
    (function(d){d.classList.add('js');try{if(sessionStorage.getItem('kph_seen'))d.classList.add('no-preloader');if(sessionStorage.getItem('kph_nav')&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('is-entering');sessionStorage.removeItem('kph_nav')}catch(e){}})(document.documentElement);
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Keystone Power Holdings, LLC",
    "url": "https://www.keystoneph.com/",
    "logo": "https://www.keystoneph.com/assets/img/favicon.svg",
    "description": "Solar developer, financier and owner of medium to large scale solar facilities for municipalities, schools, non-profits, businesses and utilities across North America.",
    "telephone": "+1-484-301-0755",
    "address": { "@type": "PostalAddress", "streetAddress": "12 Paoli Pike, Ste 5", "addressLocality": "Paoli", "addressRegion": "PA", "postalCode": "19301", "addressCountry": "US" },
    "founder": [
      { "@type": "Person", "name": "William R. DePhillipo", "jobTitle": "Co-Founder" },
      { "@type": "Person", "name": "Anthony C. Fotopoulos", "jobTitle": "Co-Founder", "sameAs": ["https://www.linkedin.com/in/anthonyfotopoulos/"] }
    ],
    "areaServed": "North America",
    "slogan": "Medium to large scale solar energy experts."
  }
  </script>
</head>
<body data-page="{{page.nav}}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="kmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C969"/><stop offset="1" stop-color="#EFA92E"/></linearGradient></defs></svg>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="preloader" aria-hidden="true">
    <div class="preloader__top"><span>Keystone Power Holdings</span><span>Medium to large scale solar</span></div>
    <div class="preloader__mark">{{mark}}</div>
    <div class="preloader__bottom">
      <p class="preloader__count"><span>000</span><small>%</small></p>
      <p class="preloader__words"><span class="preloader__track"><span>Develop.</span><span>Finance.</span><span>Build.</span><span><em>Own.</em></span></span></p>
    </div>
    <div class="preloader__bar"><i></i></div>
  </div>

  <div class="curtain" aria-hidden="true">
    <div class="curtain__a"></div>
    <div class="curtain__b">
      <p class="curtain__k">Keystone Power Holdings</p>
      <p class="curtain__title"><span>Keystone</span></p>
      <div class="curtain__mark">{{mark}}</div>
    </div>
  </div>
  <script>try{var t=sessionStorage.getItem('kph_nav_t');if(t){document.querySelector('.curtain__title span').textContent=t;sessionStorage.removeItem('kph_nav_t')}}catch(e){}</script>
  <div class="progress" aria-hidden="true"><i></i></div>

  {{> header}}

  <main id="main">
{{BODY}}
  </main>

  {{> footer}}

  <div class="dock" aria-label="Quick actions">
    <a class="dock__call" href="tel:+14843010755">{{icon:phone}}<span>Call</span></a>
    <a class="dock__cta" href="contact.html">Start a project {{icon:arrow}}</a>
  </div>

  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/vendor/lenis.min.js" defer></script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
</body>
</html>
